name: Build Android APK (Godot 4.7.2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  APK_NAME: "MenchTakhtePersian.apk"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download & Install Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }} and Export Templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

          echo "Downloading Godot Linux binary..."
          curl -fSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot"/Godot_v*linux.x86_64 "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

          echo "Downloading Godot Export Templates..."
          curl -fSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates_ext
          mv /tmp/templates_ext/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates_ext

          "$HOME/godot/godot" --version

      - name: Configure Godot Android SDK & Debug Keystore settings
        run: |
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using ANDROID_SDK=$SDK_PATH"
          echo "Using JAVA_HOME=$JAVA_HOME"
          ls -la "$SDK_PATH/build-tools" || true

          mkdir -p "$HOME/.config/godot"
          cat <<EOF > "$HOME/.config/godot/editor_settings-4.7.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Godot project assets & run smoke test
        run: |
          "$HOME/godot/godot" --headless --path . --import --quit
          "$HOME/godot/godot" --headless --path . res://tools/SmokeTest.tscn

      - name: Export Android APK
        run: |
          mkdir -p build
          "$HOME/godot/godot" --headless --verbose --path . --export-debug "Android" "build/${APK_NAME}"
          ls -lh "build/${APK_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenchTakhtePersian-Android-APK
          path: build/${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "منچ و تخته نرد پارسی (نسخه اندروید APK)"
          body: |
            خروجی اندروید APK ساخته شده با Godot 4.7.2 در GitHub Actions.
            فایل `MenchTakhtePersian.apk` را مستقیماً دانلود و روی گوشی اندرویدی نصب کنید.
          files: build/${{ env.APK_NAME }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
